<!DOCTYPE html><html lang='it'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>ColorHandLove Studio</title>
<link rel='manifest' href='manifest.json'>
<link rel='icon' href='assets/logo-circle.png'>
<meta name='theme-color' content='#FF3BA9'>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#FFF8FD;color:#333}
header{background:#FFEA00;padding:18px;display:flex;gap:12px;align-items:center}
header img{height:42px}
.wrap{padding:18px}
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.btn{background:#FF3BA9;color:white;padding:14px;border:none;border-radius:14px;width:100%;font-weight:bold}
label{display:block;margin-top:10px;font-size:14px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd}
.price{font-size:38px;font-weight:bold;color:#FF3BA9;text-align:center}
.small{text-align:center;color:#666}
</style></head><body>
<header><img src='assets/logo-horizontal.png'><div><b>Studio 3.0</b><br><small>Con Colorino ✨</small></div></header>
<div class='wrap'>
<div class='card' style='display:flex;gap:14px;align-items:center'>
<img src='assets/colorino.png' style='width:74px'>
<div><b>Ciao Debora!</b><br><small>Benvenuta nella prima build installabile della tua PWA.</small></div></div>
<div class='grid'>
<button class='btn'>Nuovo Preventivo</button>
<button class='btn' style='background:#FF6500'>Listino</button>
<button class='btn' style='background:#90C4ED'>Agenda</button>
<button class='btn' style='background:#FFA2E5'>Statistiche</button>
</div>
<div class='card'>
<h3>Calcolatore Prezzi</h3>
<label>Servizio</label>
<select id='service'><option>Illustrazione A4</option><option>Illustrazione A3</option><option>Quadro dipinto</option><option>Logo Basic</option><option>Logo Premium</option></select>
<label>Tariffa oraria (€)</label><input id='hourly' type='number' value='30'>
<label>Ore di lavoro</label><input id='hours' type='number' step='0.5' value='3'>
<label>Materiali (€)</label><input id='materials' type='number' value='5'>
<label>Margine (%)</label><input id='margin' type='number' value='35'>
<div class='price' id='price'>€149</div>
<div class='small'>Colorino approva questo prezzo ✨</div>
</div></div>
<script>
const mult={ 'Illustrazione A4':1,'Illustrazione A3':1.3,'Quadro dipinto':1.2,'Logo Basic':2.8,'Logo Premium':4};
function calc(){
 let h=+hourly.value,m=+materials.value,hrs=+hours.value,mar=+margin.value;
 let c=h*hrs*mult[service.value]+m;
 let p=Math.ceil((c/(1-mar/100))/10)*10-1;
 price.textContent='€'+p;
}
document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script></body></html>
